api_platform:
    title: Hello API Platform
    version: 1.0.0
    formats:
        jsonld: ['application/ld+json']
    # Docs are registered only in dev; see when@dev below.
    enable_docs: false
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        extra_properties:
            standard_put: true
            rfc_7807_compliant_errors: true
    # removed legacy options for API Platform 4

when@dev:
    api_platform:
        enable_docs: true
        docs_formats:
            jsonld: ['application/ld+json']
            jsonopenapi: ['application/vnd.openapi+json']
            html: ['text/html']
